# Rate limit for creating links (POST /) and admin logins.
# limit_req_zone must be in the http {} context; files in sites-enabled are.
limit_req_zone $binary_remote_addr zone=tiny_url_post:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vandesluis.com www.vandesluis.com;
    return 301 https://vandesluis.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vandesluis.com;

    ssl_certificate /etc/letsencrypt/live/vandesluis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vandesluis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://vandesluis.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vandesluis.com;

    ssl_certificate /etc/letsencrypt/live/vandesluis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vandesluis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 16k;
    server_tokens off;

    location /static/ {
        alias /srv/tiny_url/static/;
    }

    # Must match ADMIN_URL in .env. Only reachable from home.
    location /CHANGE-ME-ADMIN-URL/ {
        allow 127.0.0.1;
        # allow <home IP>;  (keep in sync with ufw-duckdns, or go via VPN)
        deny all;
        limit_req zone=tiny_url_post burst=5 nodelay;
        include /etc/nginx/snippets/tiny_url_proxy.conf;
    }

    location = / {
        limit_req zone=tiny_url_post burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/tiny_url_proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/tiny_url_proxy.conf;
    }
}

